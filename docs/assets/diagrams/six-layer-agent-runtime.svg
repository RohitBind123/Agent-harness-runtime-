<svg xmlns="http://www.w3.org/2000/svg" width="920" height="742" viewBox="0 0 920 742" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="920" height="742" fill="#FFFFFF"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1A1A1A">Figure A — The Six-Layer Agent Runtime</text>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#666">Blue is the kernel you do not write · dashed plum is code you write · grey is your product</text>

  <!-- SURFACE -->
  <rect x="60" y="74" width="740" height="56" rx="5" fill="#EFEFEF" stroke="#666" stroke-width="1.5"/>
  <text x="76" y="97" font-size="13" font-weight="bold" fill="#333">SURFACE</text>
  <text x="76" y="116" font-size="11" fill="#555">chat · IDE · inbox · dashboard · CLI · webhook · another agent</text>
  <text x="812" y="106" font-size="10" fill="#888">you already have it</text>

  <!-- EDGE -->
  <rect x="60" y="152" width="740" height="62" rx="5" fill="#F7EDF7" stroke="#7B3F7B" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="76" y="175" font-size="13" font-weight="bold" fill="#5E2F5E">EDGE</text>
  <text x="76" y="194" font-size="11" fill="#5E2F5E">stateless · accepts goals, approvals, signals · streams read-models</text>
  <text x="76" y="209" font-size="11" font-weight="bold" fill="#A03030">no loop · no consumer · no model call</text>
  <text x="812" y="187" font-size="10" fill="#888">new, and thin</text>

  <!-- SUBSTRATE -->
  <rect x="60" y="236" width="740" height="72" rx="5" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>
  <text x="76" y="259" font-size="13" font-weight="bold" fill="#26343C">SUBSTRATE</text>
  <text x="76" y="277" font-size="11" fill="#37474F">one transactional database · one queue · nothing else</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#26343C">
    <rect x="76"  y="284" width="86" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="119" y="296" text-anchor="middle">events</text>
    <rect x="170" y="284" width="94" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="217" y="296" text-anchor="middle">commands</text>
    <rect x="272" y="284" width="70" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="307" y="296" text-anchor="middle">runs</text>
    <rect x="350" y="284" width="86" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="393" y="296" text-anchor="middle">run_steps</text>
    <rect x="444" y="284" width="92" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="490" y="296" text-anchor="middle">activities</text>
    <rect x="544" y="284" width="96" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="592" y="296" text-anchor="middle">run_signals</text>
    <rect x="648" y="284" width="70" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="683" y="296" text-anchor="middle">budget</text>
    <rect x="726" y="284" width="66" height="17" rx="2" fill="#FFF" stroke="#90A4AE"/><text x="759" y="296" text-anchor="middle">approvals</text>
  </g>
  <text x="812" y="272" font-size="10" fill="#888">off the shelf</text>

  <!-- KERNEL -->
  <rect x="60" y="330" width="740" height="118" rx="5" fill="#E8EDF9" stroke="#1F3A93" stroke-width="2"/>
  <text x="76" y="353" font-size="13" font-weight="bold" fill="#152B6E">KERNEL</text>
  <text x="146" y="353" font-size="11" font-style="italic" fill="#3355AA">the part you do not write</text>
  <g>
    <rect x="76" y="366" width="170" height="66" rx="4" fill="#FFFFFF" stroke="#1F3A93" stroke-width="1.3"/>
    <text x="161" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#152B6E">RELAY</text>
    <text x="161" y="403" text-anchor="middle" font-size="9.5" fill="#33478C">claims, never a cursor</text>
    <text x="161" y="417" text-anchor="middle" font-size="9.5" fill="#33478C">one in flight per partition</text>

    <rect x="256" y="366" width="170" height="66" rx="4" fill="#FFFFFF" stroke="#1F3A93" stroke-width="1.3"/>
    <text x="341" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#152B6E">RUN DRIVER</text>
    <text x="341" y="403" text-anchor="middle" font-size="9.5" fill="#33478C">lease + version CAS</text>
    <text x="341" y="417" text-anchor="middle" font-size="9.5" fill="#33478C">checkpoints every step</text>

    <rect x="436" y="366" width="180" height="66" rx="4" fill="#FFFFFF" stroke="#1F3A93" stroke-width="1.3"/>
    <text x="526" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#152B6E">ACTIVITY RUNNER</text>
    <text x="526" y="403" text-anchor="middle" font-size="9.5" fill="#33478C">idempotent · leased · budgeted</text>
    <text x="526" y="417" text-anchor="middle" font-size="9.5" fill="#33478C">all non-determinism lives here</text>

    <rect x="626" y="366" width="158" height="66" rx="4" fill="#FFFFFF" stroke="#1F3A93" stroke-width="1.3"/>
    <text x="705" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#152B6E">SWEEPER</text>
    <text x="705" y="403" text-anchor="middle" font-size="9.5" fill="#33478C">expires leases + claims</text>
    <text x="705" y="417" text-anchor="middle" font-size="9.5" fill="#33478C">continuous, never at boot</text>
  </g>

  <!-- PORTS -->
  <rect x="60" y="470" width="740" height="96" rx="5" fill="#F7EDF7" stroke="#7B3F7B" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="76" y="493" font-size="13" font-weight="bold" fill="#5E2F5E">PORTS</text>
  <text x="136" y="493" font-size="11" font-style="italic" fill="#8A4E8A">the six things you write — the entire extension surface</text>
  <g font-size="11" fill="#5E2F5E">
    <rect x="76"  y="504" width="112" height="24" rx="3" fill="#FFF" stroke="#7B3F7B"/><text x="132" y="520" text-anchor="middle">1 · planner</text>
    <rect x="196" y="504" width="112" height="24" rx="3" fill="#FFF" stroke="#7B3F7B"/><text x="252" y="520" text-anchor="middle">2 · tool</text>
    <rect x="316" y="504" width="112" height="24" rx="3" fill="#FFF" stroke="#7B3F7B"/><text x="372" y="520" text-anchor="middle">3 · model</text>
    <rect x="436" y="504" width="112" height="24" rx="3" fill="#FFF" stroke="#7B3F7B"/><text x="492" y="520" text-anchor="middle">4 · grader</text>
    <rect x="556" y="504" width="112" height="24" rx="3" fill="#FFF" stroke="#7B3F7B"/><text x="612" y="520" text-anchor="middle">5 · approval</text>
    <rect x="676" y="504" width="108" height="24" rx="3" fill="#FFF" stroke="#7B3F7B"/><text x="730" y="520" text-anchor="middle">6 · domain</text>
  </g>
  <text x="76" y="551" font-size="10" fill="#8A4E8A">a tool is tagged pure or effectful — an effectful tool is structurally uncallable without a resolved gate</text>

  <!-- NARROW WAIST -->
  <line x1="60" y1="584" x2="800" y2="584" stroke="#B85C00" stroke-width="1.4" stroke-dasharray="3 3"/>
  <rect x="330" y="572" width="200" height="24" rx="12" fill="#FDF0E3" stroke="#B85C00" stroke-width="1.4"/>
  <text x="430" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A4600">THE NARROW WAIST</text>

  <!-- DOMAIN -->
  <rect x="60" y="612" width="740" height="72" rx="5" fill="#EFEFEF" stroke="#666" stroke-width="1.5"/>
  <text x="76" y="635" font-size="13" font-weight="bold" fill="#333">YOUR DOMAIN</text>
  <text x="76" y="654" font-size="11" fill="#555">aggregates · invariants · your tables — knows nothing about the runtime</text>
  <text x="76" y="672" font-size="11" font-weight="bold" fill="#A03030">delete the entire runtime and this layer still compiles</text>
  <text x="812" y="648" font-size="10" fill="#888">you already have it</text>

  <!-- side rail: commands down / events up -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#B85C00"/>
    </marker>
  </defs>
  <line x1="36" y1="236" x2="36" y2="640" stroke="#B85C00" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="440" font-size="10.5" font-weight="bold" fill="#8A4600" transform="rotate(-90 30 440)" text-anchor="middle">COMMANDS  (imperative, idempotency key)</text>
  <line x1="884" y1="640" x2="884" y2="236" stroke="#B85C00" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="890" y="440" font-size="10.5" font-weight="bold" fill="#8A4600" transform="rotate(90 890 440)" text-anchor="middle">EVENTS  (past tense, same transaction)</text>

  <text x="460" y="712" text-anchor="middle" font-size="10.5" fill="#666">Exactly two kinds of message cross the waist. No shared tables, no foreign keys, no imports in either direction.</text>
  <text x="460" y="730" text-anchor="middle" font-size="10.5" fill="#666">That absence is what makes the runtime replaceable, testable, and reusable across products.</text>
</svg>
