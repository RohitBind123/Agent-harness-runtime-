<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="980" height="600" fill="#FFFFFF"/>
  <text x="490" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1A1A1A">Figure B — Agentic Harness Engineering: the closed loop</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#666">Three observability pillars turn every harness edit into a falsifiable contract</text>

  <defs>
    <marker id="b1" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#1F3A93"/>
    </marker>
    <marker id="b2" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#B85C00"/>
    </marker>
  </defs>

  <!-- PILLAR I : harness -->
  <rect x="40" y="96" width="250" height="212" rx="6" fill="#E8EDF9" stroke="#1F3A93" stroke-width="2"/>
  <rect x="40" y="96" width="250" height="26" rx="6" fill="#1F3A93"/>
  <text x="165" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">I · COMPONENT OBSERVABILITY</text>
  <text x="165" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#152B6E">THE HARNESS</text>
  <text x="165" y="158" text-anchor="middle" font-size="9.5" fill="#33478C">seven editable component types, as files</text>
  <g font-size="9.5" fill="#152B6E">
    <rect x="54"  y="170" width="106" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="107" y="184" text-anchor="middle">system prompt</text>
    <rect x="170" y="170" width="106" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="223" y="184" text-anchor="middle">tool description</text>
    <rect x="54"  y="197" width="106" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="107" y="211" text-anchor="middle">tool impl.</text>
    <rect x="170" y="197" width="106" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="223" y="211" text-anchor="middle">middleware</text>
    <rect x="54"  y="224" width="106" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="107" y="238" text-anchor="middle">skill</text>
    <rect x="170" y="224" width="106" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="223" y="238" text-anchor="middle">sub-agent</text>
    <rect x="54"  y="251" width="222" height="21" rx="3" fill="#FFF" stroke="#1F3A93"/><text x="165" y="265" text-anchor="middle">long-term memory</text>
  </g>
  <text x="165" y="290" text-anchor="middle" font-size="9.5" font-style="italic" fill="#33478C">one failure pattern → one component class</text>
  <text x="165" y="302" text-anchor="middle" font-size="9.5" font-style="italic" fill="#33478C">one edit → one git commit → file-level rollback</text>

  <!-- CODING AGENT -->
  <rect x="360" y="112" width="180" height="92" rx="6" fill="#FFFFFF" stroke="#555" stroke-width="1.6"/>
  <text x="450" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CODING AGENT</text>
  <text x="450" y="160" text-anchor="middle" font-size="10" fill="#555">base model held FIXED</text>
  <text x="450" y="177" text-anchor="middle" font-size="10" fill="#555">k rollouts per task</text>
  <text x="450" y="194" text-anchor="middle" font-size="10" fill="#555">fresh sandbox each run</text>

  <rect x="360" y="228" width="180" height="56" rx="6" fill="#EFEFEF" stroke="#666" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="450" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">ENVIRONMENT</text>
  <text x="450" y="270" text-anchor="middle" font-size="9.5" fill="#555">shell · files · network · verifier</text>
  <line x1="450" y1="204" x2="450" y2="226" stroke="#555" stroke-width="1.4" marker-end="url(#b1)"/>
  <line x1="470" y1="226" x2="470" y2="206" stroke="#555" stroke-width="1.4" marker-end="url(#b1)"/>

  <!-- PILLAR II : debugger -->
  <rect x="610" y="96" width="330" height="212" rx="6" fill="#E8EDF9" stroke="#1F3A93" stroke-width="2"/>
  <rect x="610" y="96" width="330" height="26" rx="6" fill="#1F3A93"/>
  <text x="775" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">II · EXPERIENCE OBSERVABILITY</text>
  <text x="775" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#152B6E">AGENT DEBUGGER</text>

  <rect x="628" y="156" width="126" height="54" rx="4" fill="#FFF" stroke="#90A4AE"/>
  <text x="691" y="176" text-anchor="middle" font-size="10.5" fill="#444">raw trajectories</text>
  <text x="691" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#A03030">~10M tokens</text>

  <line x1="758" y1="183" x2="792" y2="183" stroke="#1F3A93" stroke-width="1.8" marker-end="url(#b1)"/>
  <text x="775" y="176" text-anchor="middle" font-size="8.5" fill="#33478C">distil</text>

  <rect x="798" y="156" width="126" height="54" rx="4" fill="#FFF" stroke="#1F3A93" stroke-width="1.4"/>
  <text x="861" y="176" text-anchor="middle" font-size="10.5" fill="#444">evidence corpus</text>
  <text x="861" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B7A3D">~10K tokens</text>

  <text x="775" y="232" text-anchor="middle" font-size="9.5" fill="#33478C">trajectories as a navigable file environment · progressive disclosure</text>
  <text x="775" y="250" text-anchor="middle" font-size="9.5" fill="#33478C">per-task root-cause reports  →  one benchmark-level overview</text>
  <rect x="628" y="262" width="296" height="34" rx="4" fill="#F5F7FD" stroke="#8FA3D8"/>
  <text x="776" y="283" text-anchor="middle" font-size="10" font-style="italic" fill="#33478C">the evolver reads structured root causes, never raw logs</text>

  <!-- PILLAR III : evolve agent + manifest -->
  <rect x="290" y="366" width="400" height="164" rx="6" fill="#FDF0E3" stroke="#B85C00" stroke-width="2"/>
  <rect x="290" y="366" width="400" height="26" rx="6" fill="#B85C00"/>
  <text x="490" y="384" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">III · DECISION OBSERVABILITY</text>
  <text x="490" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A4600">EVOLVE AGENT  ·  CHANGE MANIFEST</text>
  <g font-size="10" fill="#7A4300">
    <rect x="306" y="424" width="180" height="20" rx="3" fill="#FFF" stroke="#C98A45"/><text x="396" y="438" text-anchor="middle">failure evidence</text>
    <rect x="494" y="424" width="180" height="20" rx="3" fill="#FFF" stroke="#C98A45"/><text x="584" y="438" text-anchor="middle">inferred root cause</text>
    <rect x="306" y="450" width="180" height="20" rx="3" fill="#FFF" stroke="#C98A45"/><text x="396" y="464" text-anchor="middle">targeted fix + component level</text>
    <rect x="494" y="450" width="180" height="20" rx="3" fill="#FFF" stroke="#C98A45"/><text x="584" y="464" text-anchor="middle">predicted fixes + risk tasks</text>
  </g>
  <rect x="306" y="478" width="368" height="40" rx="4" fill="#FFF8F0" stroke="#B85C00" stroke-width="1.3"/>
  <text x="490" y="494" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A4600">next round intersects predictions with observed task deltas</text>
  <text x="490" y="510" text-anchor="middle" font-size="10.5" fill="#8A4600">verdict → KEEP · IMPROVE · ROLLBACK AND PIVOT</text>

  <!-- flow arrows -->
  <line x1="290" y1="180" x2="356" y2="180" stroke="#1F3A93" stroke-width="2" marker-end="url(#b1)"/>
  <text x="323" y="172" text-anchor="middle" font-size="9" fill="#33478C">runs</text>

  <line x1="540" y1="180" x2="606" y2="180" stroke="#1F3A93" stroke-width="2" marker-end="url(#b1)"/>
  <text x="573" y="172" text-anchor="middle" font-size="9" fill="#33478C">traces</text>

  <path d="M775 312 L775 344 L690 344 L690 400" fill="none" stroke="#B85C00" stroke-width="2" marker-end="url(#b2)"/>
  <text x="742" y="338" text-anchor="middle" font-size="9" fill="#8A4600">evidence</text>

  <path d="M290 448 L200 448 L200 330 L165 330 L165 312" fill="none" stroke="#B85C00" stroke-width="2" marker-end="url(#b2)"/>
  <text x="205" y="392" font-size="9" fill="#8A4600">edit components</text>

  <!-- controllability note -->
  <rect x="40" y="548" width="900" height="36" rx="5" fill="#F6F6F6" stroke="#999" stroke-dasharray="5 3"/>
  <text x="490" y="564" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">CONTROLLABILITY — the evolve agent writes only inside the harness workspace</text>
  <text x="490" y="578" text-anchor="middle" font-size="10" fill="#555">runs directory, tracer, verifier and model configuration are read-only, so every recorded gain stays attributable to harness edits</text>
</svg>
